      TypeName: Query
      FieldName: outputDate
      Kind: UNIT
      DataSourceName: !GetAtt Echo.Name
      RequestMappingTemplate: '{"version": "2018-05-29", "payload": {}}'
      ResponseMappingTemplate: $ctx.args.json

