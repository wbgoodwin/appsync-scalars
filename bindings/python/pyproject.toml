[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "appsync-scalars"
version = "0.1.1"
description = "Validates AWS AppSync date and time scalar values."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["appsync", "aws", "graphql", "validation", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/wbgoodwin/appsync-scalars"
Documentation = "https://github.com/wbgoodwin/appsync-scalars/blob/main/bindings/python/README.md"

[project.optional-dependencies]
pydantic = ["pydantic>=2"]

[dependency-groups]
dev = ["pydantic>=2", "pytest>=8"]

[tool.maturin]
python-source = "python"
module-name = "appsync_scalars._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
