AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Echo API used to record how AppSync treats the values of its scalars. It stores
  nothing and can be deleted after recording.

# Each scalar gets two fields so AppSync's two checks can be observed separately:
#   input*  takes the scalar and returns String, so only input coercion applies.
#   output* takes JSON text and returns the scalar, so only output serialization applies.
#
# Output resolvers are VTL so that text reaches AppSync unchanged. JavaScript rounds integers
# beyond 2^53, and AppSync rejected 1610368224 when a JavaScript resolver here returned it as a
# bare number. Other JavaScript resolver shapes, such as an object with a timestamp field, are
# untested.

Resources:
  Api:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Ref AWS::StackName
      AuthenticationType: API_KEY

  # With no Expires set, AppSync expires this key after 7 days.
  ApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt Api.ApiId
      Description: Used by the conformance recorder

  Schema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt Api.ApiId
      Definition: |
        type Query {
          inputDate(value: AWSDate): String
          inputTime(value: AWSTime): String
          inputDateTime(value: AWSDateTime): String
          inputTimestamp(value: AWSTimestamp): String
          inputUrl(value: AWSURL): String
          inputEmail(value: AWSEmail): String
          inputPhone(value: AWSPhone): String
          inputIpAddress(value: AWSIPAddress): String
          inputJson(value: AWSJSON): String
          outputDate(json: String!): AWSDate
          outputTime(json: String!): AWSTime
          outputDateTime(json: String!): AWSDateTime
          outputTimestamp(json: String!): AWSTimestamp
          outputUrl(json: String!): AWSURL
          outputEmail(json: String!): AWSEmail
          outputPhone(json: String!): AWSPhone
          outputIpAddress(json: String!): AWSIPAddress
          outputJson(json: String!): AWSJSON
        }

        schema {
          query: Query
        }

  Echo:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt Api.ApiId
      Name: Echo
      Type: NONE

  InputDateResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: inputDate
      Kind: UNIT
      DataSourceName: !GetAtt Echo.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          const value = ctx.args.value;
          return { payload: JSON.stringify(value === undefined ? null : value) };
        }
        export function response(ctx) {
          return ctx.result;
        }

  InputTimeResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: inputTime
      Kind: UNIT
      DataSourceName: !GetAtt Echo.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          const value = ctx.args.value;
          return { payload: JSON.stringify(value === undefined ? null : value) };
        }
        export function response(ctx) {
          return ctx.result;
        }

  InputDateTimeResolver:
    Type: AWS::AppSync::Resolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: inputDateTime
      Kind: UNIT
      DataSourceName: !GetAtt Echo.Name
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: 1.0.0
      Code: |
        export function request(ctx) {
          const value = ctx.args.value;
          return { payload: JSON.stringify(value === undefined ? null : value) };
        }
        export function response(ctx) {
          return ctx.result;
        }

